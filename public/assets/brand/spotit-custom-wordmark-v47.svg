<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 760" role="img" aria-labelledby="title desc">
  <title id="title">Spotit custom wound-care wordmark</title>
  <desc id="desc">Spotit wordmark with individually adjusted forward-leaning letters, orange Spot, blue it, and a wound marker inside the o.</desc>
  <rect width="1400" height="760" fill="#ffffff"/>
  <defs>
    <style>
      .letter {
        font-family: Arial Black, Arial, Helvetica, sans-serif;
        font-weight: 900;
        font-style: italic;
        dominant-baseline: alphabetic;
      }
      .orange { fill: #ff5b00; }
      .blue { fill: #005eb8; }
      .base { fill: #005eb8; opacity: .98; }
    </style>
    <clipPath id="lower-s"><rect x="75" y="478" width="270" height="80" rx="22"/></clipPath>
    <clipPath id="lower-p"><rect x="330" y="478" width="190" height="95" rx="22"/></clipPath>
    <clipPath id="lower-o"><rect x="528" y="478" width="215" height="80" rx="22"/></clipPath>
    <clipPath id="lower-t"><rect x="735" y="478" width="165" height="80" rx="22"/></clipPath>
  </defs>

  <g transform="translate(0 20)">
    <text class="letter base" x="82" y="520" font-size="290" transform="skewX(-7)" clip-path="url(#lower-s)">S</text>
    <text class="letter orange" x="82" y="520" font-size="290" transform="skewX(-7) scale(1.05 1)">S</text>

    <text class="letter base" x="340" y="520" font-size="290" transform="skewX(-8)" clip-path="url(#lower-p)">p</text>
    <text class="letter orange" x="340" y="520" font-size="290" transform="skewX(-8) scale(.96 1.06)">p</text>

    <text class="letter base" x="540" y="520" font-size="270" transform="skewX(-7)" clip-path="url(#lower-o)">o</text>
    <text class="letter orange" x="540" y="520" font-size="270" transform="skewX(-7) scale(1 .98)">o</text>

    <text class="letter base" x="760" y="520" font-size="278" transform="skewX(-9)" clip-path="url(#lower-t)">t</text>
    <text class="letter orange" x="760" y="520" font-size="278" transform="skewX(-9) scale(.94 1.04)">t</text>

    <text class="letter blue" x="910" y="520" font-size="280" transform="skewX(-8) scale(.88 1)">i</text>
    <circle cx="947" cy="300" r="37" fill="#ff5b00"/>

    <text class="letter blue" x="1010" y="520" font-size="282" transform="skewX(-8) scale(.95 1.04)">t</text>

    <g aria-hidden="true">
      <circle cx="633" cy="408" r="33" fill="#ffe6dc"/>
      <circle cx="633" cy="408" r="22" fill="#d92d20"/>
      <circle cx="633" cy="408" r="10" fill="#7a0015"/>
    </g>
  </g>
</svg>
