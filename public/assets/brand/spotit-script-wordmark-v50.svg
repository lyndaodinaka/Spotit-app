<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 760" role="img" aria-labelledby="title desc">
  <title id="title">Spotit warm handwritten wordmark</title>
  <desc id="desc">Warm orange-red Spotit script wordmark with an oversized capital S, thick rounded strokes, forward slant, and wound-care marker in the o.</desc>
  <rect width="1400" height="760" fill="#ffffff"/>
  <defs>
    <linearGradient id="warmText" x1="0" x2="1" y1="0" y2="0">
      <stop offset="0%" stop-color="#ff7a00"/>
      <stop offset="48%" stop-color="#ff5b00"/>
      <stop offset="100%" stop-color="#d92d20"/>
    </linearGradient>
    <filter id="soften" x="-8%" y="-8%" width="116%" height="116%">
      <feDropShadow dx="0" dy="2" stdDeviation="1.4" flood-color="#d92d20" flood-opacity=".08"/>
    </filter>
    <style>
      .script {
        font-family: "Segoe Script", "Brush Script MT", "Comic Sans MS", cursive;
        font-weight: 700;
        font-style: italic;
        fill: url(#warmText);
        paint-order: stroke fill;
        stroke: url(#warmText);
        stroke-width: 4;
        stroke-linejoin: round;
        stroke-linecap: round;
        filter: url(#soften);
      }
    </style>
  </defs>
  <g transform="translate(72 46) skewX(-11)">
    <text class="script" x="0" y="498" font-size="330">S</text>
    <text class="script" x="250" y="498" font-size="258">potit</text>
    <g aria-hidden="true" transform="skewX(11)">
      <circle cx="555" cy="385" r="35" fill="#fff0ea"/>
      <circle cx="555" cy="385" r="23" fill="#d92d20"/>
      <circle cx="555" cy="385" r="10" fill="#7a0015"/>
    </g>
  </g>
</svg>
